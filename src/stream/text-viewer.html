<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandom Text Stream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d12; color: #e6e9ef; font: 13px/1.5 ui-monospace, Menlo, monospace; display: flex; min-height: 100vh; }
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 14px; }
  video { display: block; background: #000; max-width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.6); border-radius: 6px; }
  #stats { font-size: 12px; color: #8b93a7; }
  #stats b { color: #9ad; font-variant-numeric: tabular-nums; }
  #panel { width: 300px; background: #12151d; border-left: 1px solid #1f2430; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  #panel h1 { font-size: 14px; margin: 0; }
  #status { font-size: 12px; color: #8b93a7; }
  #status.live { color: #5d6; }
  #status.error { color: #f55; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b7385; }
  button, input[type=text] { font: inherit; background: #1d2433; color: #cdd4e2; border: 1px solid #2a3346; padding: 8px 10px; border-radius: 5px; }
  button { cursor: pointer; text-align: left; }
  button:hover { background: #283246; }
  button.on { background: #2b4a7a; border-color: #3a6; color: #cfe; }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <div id="stats">render <b id="s-render">—</b> · atlas <b id="s-atlas">—</b> · fps <b id="s-fps">—</b></div>
  </div>
  <div id="panel">
    <div><h1>Sandom Text Stream</h1><div id="status">connecting…</div></div>
    <div class="group">
      <h3>Controls</h3>
      <button id="btn-anim">Animate (cycle messages)</button>
      <input type="text" id="txt" placeholder="type custom text + Enter" maxlength="80">
    </div>
  </div>
<script type="module">
const video = document.getElementById('video');
const el = (id) => document.getElementById(id);
const statusEl = el('status');
let mediaSource = null, sourceBuffer = null, mimeCodec = null;
const appendQueue = []; let initAppended = false;
let fpsTimes = [];

function setStatus(t, c) { statusEl.textContent = t; statusEl.className = c || ''; }

function drainQueue() {
  if (!sourceBuffer || sourceBuffer.updating || appendQueue.length === 0) return;
  try { sourceBuffer.appendBuffer(appendQueue.shift()); }
  catch (err) { if (err.name === 'QuotaExceededError') { evict(); } else setStatus('append error: ' + err.message, 'error'); }
}
function evict() {
  if (!sourceBuffer || sourceBuffer.updating || sourceBuffer.buffered.length === 0) return;
  const start = sourceBuffer.buffered.start(0);
  const keepFrom = Math.max(start, video.currentTime - 1.5);
  if (keepFrom - start > 0.1) { try { sourceBuffer.remove(start, keepFrom); } catch {} }
}
function maintain() {
  if (!sourceBuffer || video.buffered.length === 0) return;
  const end = video.buffered.end(video.buffered.length - 1);
  const drift = end - video.currentTime;
  if (drift > 4) { try { video.currentTime = end - 0.2; } catch {} video.playbackRate = 1; }
  else if (drift > 0.3) video.playbackRate = 1.08; else video.playbackRate = 1;
  if (video.paused && video.readyState >= 2) video.play().catch(() => {});
}
function setupMSE() {
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);
  mediaSource.addEventListener('sourceopen', () => {
    if (!MediaSource.isTypeSupported(mimeCodec)) { setStatus('codec unsupported: ' + mimeCodec, 'error'); return; }
    sourceBuffer = mediaSource.addSourceBuffer(mimeCodec);
    sourceBuffer.mode = 'sequence';
    sourceBuffer.addEventListener('updateend', () => { evict(); drainQueue(); maintain(); });
    drainQueue();
  });
  video.addEventListener('waiting', maintain);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'init') { mimeCodec = m.mimeCodec; setupMSE(); setStatus('live', 'live'); }
      else if (m.type === 'stats') {
        const now = performance.now(); fpsTimes.push(now); fpsTimes = fpsTimes.filter((t) => now - t < 1000);
        el('s-render').textContent = (m.renderMs ?? 0).toFixed(2) + ' ms';
        el('s-atlas').textContent = m.atlasSize ?? '—';
        el('s-fps').textContent = fpsTimes.length;
      }
      return;
    }
    const bytes = new Uint8Array(e.data);
    appendQueue.push(bytes); drainQueue();
    if (!initAppended) initAppended = true;
  };
  ws.onopen = () => setStatus('connected…', 'live');
  ws.onclose = () => { setStatus('disconnected — retrying…', 'error'); setTimeout(connect, 1000); };
  window._ws = ws;
}

function send(o) { if (window._ws && window._ws.readyState === WebSocket.OPEN) window._ws.send(JSON.stringify(o)); }

let animating = true;
el('btn-anim').classList.add('on');
el('btn-anim').onclick = (e) => { animating = !animating; e.target.classList.toggle('on', animating); send({ type: 'animate', on: animating }); };
el('txt').onkeydown = (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    animating = false; el('btn-anim').classList.remove('on');
    send({ type: 'settext', text: e.target.value });
  }
};

connect();
</script>
</body>
</html>
