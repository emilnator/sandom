<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandom Live Stream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0d12; color: #e6e9ef;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; min-height: 100vh;
  }
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
  #videoWrap { position: relative; box-shadow: 0 8px 40px rgba(0,0,0,.6); border-radius: 6px; overflow: hidden; }
  video { display: block; background: #000; max-width: 100%; }
  #stats {
    position: absolute; top: 10px; left: 10px;
    background: rgba(8,10,15,.78); padding: 10px 12px; border-radius: 6px;
    pointer-events: none; min-width: 220px; backdrop-filter: blur(4px);
  }
  #stats h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row .k { color: #8b93a7; }
  .row .v { color: #9ad; font-variant-numeric: tabular-nums; }
  .row .v.warn { color: #f4a; }
  #panel {
    width: 280px; background: #12151d; border-left: 1px solid #1f2430;
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 4px; }
  #status { font-size: 12px; color: #8b93a7; }
  #status.live { color: #5d6; }
  #status.error { color: #f55; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b7385; }
  button {
    font: inherit; background: #1d2433; color: #cdd4e2; border: 1px solid #2a3346;
    padding: 8px 10px; border-radius: 5px; cursor: pointer; text-align: left;
  }
  button:hover { background: #283246; border-color: #3a4760; }
  button:active { transform: translateY(1px); }
  button.on { background: #2b4a7a; border-color: #3a6; color: #cfe; }
  label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <div id="videoWrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="stats">
        <h2>Live Stats</h2>
        <div class="row"><span class="k">fps</span><span class="v" id="s-fps">—</span></div>
        <div class="row"><span class="k">render</span><span class="v" id="s-render">—</span></div>
        <div class="row"><span class="k">encode</span><span class="v" id="s-encode">—</span></div>
        <div class="row"><span class="k">latency</span><span class="v" id="s-latency">—</span></div>
        <div class="row"><span class="k">dirty tiles</span><span class="v" id="s-dirty">—</span></div>
        <div class="row"><span class="k">frames</span><span class="v" id="s-frames">—</span></div>
        <div class="row"><span class="k">segments</span><span class="v" id="s-segs">—</span></div>
        <div class="row"><span class="k">dropped</span><span class="v" id="s-dropped">—</span></div>
        <div class="row"><span class="k">bytes</span><span class="v" id="s-bytes">—</span></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div>
      <h1>Sandom Stream</h1>
      <div id="status">connecting…</div>
    </div>
    <div class="group">
      <h3>Mutations</h3>
      <button id="btn-move">Animate (client-driven)</button>
      <button id="btn-server">Animate (server-driven)</button>
      <button id="btn-color">Change color</button>
      <button id="btn-add">Add element</button>
      <button id="btn-remove">Remove element</button>
      <button id="btn-stress">Stress test (60Hz)</button>
    </div>
    <div class="group">
      <h3>Diagnostics</h3>
      <label class="chk"><input type="checkbox" id="chk-overlay"> Tile overlay (dirty tiles flash red)</label>
    </div>
  </div>

<script type="module">
const video = document.getElementById('video');
const statusEl = document.getElementById('status');

const el = (id) => document.getElementById(id);
const stats = {
  fps: el('s-fps'), render: el('s-render'), encode: el('s-encode'),
  latency: el('s-latency'), dirty: el('s-dirty'), frames: el('s-frames'),
  segs: el('s-segs'), dropped: el('s-dropped'), bytes: el('s-bytes'),
};

let mediaSource = null;
let sourceBuffer = null;
let mimeCodec = null;
// appendBuffer is async: you may not call it again until 'updateend'. Queue
// segments and drain one at a time.
const appendQueue = [];
let initAppended = false;

let segmentCount = 0;
let totalBytes = 0;
let lastFrameTimes = [];

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

// Keep the buffered window small: a live stream wants low latency, not a long
// backlog. Evict anything more than this many seconds behind the playhead.
const KEEP_BEHIND = 1.5;
// Tracking the live edge: if we fall more than this far behind the newest
// buffered data, ease the rate up; never hard-seek during play (seeks on a
// live MSE buffer while it churns are what froze playback).
const DRIFT_NUDGE = 0.3;
const DRIFT_MAX = 4.0;     // only beyond this do we resync by seeking

function drainAppendQueue() {
  if (!sourceBuffer || sourceBuffer.updating || appendQueue.length === 0) return;
  const chunk = appendQueue.shift();
  try {
    sourceBuffer.appendBuffer(chunk);
  } catch (err) {
    if (err.name === 'QuotaExceededError') {
      evictOldBuffered();
      appendQueue.unshift(chunk);   // retry on next updateend
    } else {
      setStatus('append error: ' + err.message, 'error');
    }
  }
}

function evictOldBuffered() {
  if (!sourceBuffer || sourceBuffer.updating || sourceBuffer.buffered.length === 0) return;
  const start = sourceBuffer.buffered.start(0);
  const keepFrom = Math.max(start, video.currentTime - KEEP_BEHIND);
  if (keepFrom - start > 0.1) {
    try { sourceBuffer.remove(start, keepFrom); } catch { /* */ }
  }
}

// Keep playback alive and near the live edge. Called after each append. The
// element can pause itself on a transient underrun and will NOT auto-resume —
// so we re-issue play() whenever it's paused but has data. We track the live
// edge with playbackRate only; a hard seek is the last resort for a big gap.
function maintainPlayback() {
  if (!sourceBuffer || video.buffered.length === 0) return;
  const end = video.buffered.end(video.buffered.length - 1);
  const drift = end - video.currentTime;

  if (drift > DRIFT_MAX) {
    // Way behind (e.g. tab was backgrounded). Resync once, into buffered range.
    const target = Math.max(video.buffered.start(0), end - 0.2);
    try { video.currentTime = target; } catch { /* */ }
    video.playbackRate = 1.0;
  } else if (drift > DRIFT_NUDGE) {
    video.playbackRate = 1.08;   // gently catch up
  } else {
    video.playbackRate = 1.0;
  }

  // Auto-resume: autoplay+muted should keep it going, but a momentary underrun
  // can leave it paused with data buffered. Re-issue play() — it's idempotent.
  if (video.paused && video.readyState >= 2) {
    video.play().catch(() => { /* autoplay race; next append retries */ });
  }
}

function setupMediaSource() {
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);
  mediaSource.addEventListener('sourceopen', () => {
    if (!MediaSource.isTypeSupported(mimeCodec)) {
      setStatus('codec not supported: ' + mimeCodec, 'error');
      return;
    }
    sourceBuffer = mediaSource.addSourceBuffer(mimeCodec);
    sourceBuffer.mode = 'sequence';
    sourceBuffer.addEventListener('updateend', () => {
      evictOldBuffered();      // keep the window small every time
      drainAppendQueue();
      maintainPlayback();
    });
    drainAppendQueue();
  });
  // A stall event is the clearest "it underran" signal — recover immediately.
  video.addEventListener('waiting', maintainPlayback);
  video.addEventListener('stalled', maintainPlayback);
}

function appendSegment(bytes) {
  appendQueue.push(bytes);
  drainAppendQueue();
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const msg = JSON.parse(e.data);
      if (msg.type === 'init') {
        mimeCodec = msg.mimeCodec;
        setupMediaSource();
        setStatus('live', 'live');
      } else if (msg.type === 'stats') {
        updateStats(msg);
      }
      return;
    }
    // Binary: first one is the init segment, the rest are media segments.
    const bytes = new Uint8Array(e.data);
    totalBytes += bytes.byteLength;
    if (!initAppended) {
      initAppended = true;
      appendSegment(bytes);
    } else {
      segmentCount++;
      appendSegment(bytes);
      // Live-edge tracking + auto-resume happens in maintainPlayback(), called
      // on each updateend (and on waiting/stalled), not here.
    }
  };

  ws.onopen = () => setStatus('connected, waiting for video…', 'live');
  ws.onclose = () => { setStatus('disconnected — retrying…', 'error'); setTimeout(connect, 1000); };
  ws.onerror = () => setStatus('connection error', 'error');

  window._ws = ws; // for mutation controls
}

function updateStats(s) {
  const now = performance.now();
  lastFrameTimes.push(now);
  lastFrameTimes = lastFrameTimes.filter((t) => now - t < 1000);
  stats.fps.textContent = lastFrameTimes.length;
  stats.render.textContent = (s.renderMs ?? 0).toFixed(2) + ' ms';
  stats.encode.textContent = (s.encodeMs ?? 0).toFixed(2) + ' ms';
  // Server-side latency: time from the start of render to encoded. (True
  // mutation→pixel-on-screen also includes network + decode, but this is the
  // server's contribution and the part we control.)
  const lat = (s.renderMs ?? 0) + (s.encodeMs ?? 0);
  stats.latency.textContent = lat.toFixed(2) + ' ms';
  const pct = s.totalTiles ? Math.round((s.dirtyTileCount / s.totalTiles) * 100) : 0;
  stats.dirty.textContent = `${s.dirtyTileCount}/${s.totalTiles} (${pct}%)`;
  stats.frames.textContent = s.frameNumber ?? '—';
  stats.segs.textContent = segmentCount;
  const dropped = s.droppedSegments ?? 0;
  stats.dropped.textContent = dropped;
  stats.dropped.classList.toggle('warn', dropped > 0);
  stats.bytes.textContent = (totalBytes / 1024).toFixed(0) + ' KB';
}

function mutate(action, params = {}) {
  if (window._ws && window._ws.readyState === WebSocket.OPEN) {
    window._ws.send(JSON.stringify({ type: 'mutate', action, ...params }));
  }
}

// --- Mutation controls ---
let moveAnim = null, stressAnim = null;
const W = () => 1280, H = () => 720;

el('btn-move').onclick = (e) => {
  if (moveAnim) { clearInterval(moveAnim); moveAnim = null; e.target.classList.remove('on'); return; }
  e.target.classList.add('on');
  // Time-based, not tick-based: derive the phase from elapsed wall-clock time
  // so the speed is independent of how often the timer actually fires. A busy
  // or backgrounded tab throttles setInterval; a per-tick increment would then
  // slow the motion, but reading the clock makes a skipped tick self-correct.
  const start = performance.now();
  const RADIANS_PER_SEC = 1.2;
  moveAnim = setInterval(() => {
    const t = ((performance.now() - start) / 1000) * RADIANS_PER_SEC;
    const x = (Math.sin(t) * 0.5 + 0.5) * (1280 - 120);
    const y = (Math.cos(t * 0.7) * 0.5 + 0.5) * (720 - 120);
    mutate('move', { x, y });
  }, 1000 / 60);
};
let serverAnim = false;
el('btn-server').onclick = (e) => {
  serverAnim = !serverAnim;
  e.target.classList.toggle('on', serverAnim);
  if (window._ws && window._ws.readyState === WebSocket.OPEN) {
    window._ws.send(JSON.stringify({ type: 'animate', on: serverAnim }));
  }
};
el('btn-color').onclick = () => mutate('color', {});
el('btn-add').onclick = () => mutate('add', {});
el('btn-remove').onclick = () => mutate('remove', {});
el('btn-stress').onclick = (e) => {
  if (stressAnim) { clearInterval(stressAnim); stressAnim = null; e.target.classList.remove('on'); return; }
  e.target.classList.add('on');
  stressAnim = setInterval(() => {
    mutate('move', { x: Math.random() * (1280 - 120), y: Math.random() * (720 - 120) });
  }, 1000 / 60);
};

el('chk-overlay').onchange = (e) => {
  if (window._ws && window._ws.readyState === WebSocket.OPEN) {
    window._ws.send(JSON.stringify({ type: 'overlay', on: e.target.checked }));
  }
};

connect();
</script>
</body>
</html>
