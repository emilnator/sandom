<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "sandom": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/mod.js",
          "sandom/src/": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/",
          "@sandom/color/color.wasm": "https://cdn.jsdelivr.net/npm/@sandom/color@0.2.0/dist/color.wasm",
          "@sandom/font-metrics/font-metrics.wasm": "https://cdn.jsdelivr.net/npm/@sandom/font-metrics@0.1.0/dist/font-metrics.wasm",
          "@sandom/gain-map/gain-map.wasm": "https://cdn.jsdelivr.net/npm/@sandom/gain-map@0.1.0/dist/gain-map.wasm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js"
        }
      }
    </script>
    <style>
      html {
        background: #14100c;
        color: #cdbd9c;
        color-scheme: dark;
        font: 13px/1.5 system-ui, sans-serif;
      }
      body { margin: 0; height: 100vh; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
      #hint { position: fixed; top: 16px; left: 18px; margin: 0; }
      .notice {
        position: fixed; inset: 0; display: grid; place-items: center;
        margin: 0; padding: 24px; background: #14100c; text-align: center;
      }
      .notice[hidden] { display: none; }
    </style>
    <title>A Wikipedia article on a scroll</title>
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="A paper scroll between two wooden rollers carrying the Wikipedia article on the Dead Sea Scrolls. Scroll to read; the rollers turn."></canvas>
    <p id="hint">Scroll to read.</p>
    <p class="notice" id="notice" role="status">Loading the article and its fonts…</p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
