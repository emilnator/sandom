<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandom code editor</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "sandom": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/mod.js",
          "sandom/src/": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/",
          "@sandom/color/color.wasm": "https://cdn.jsdelivr.net/npm/@sandom/color@0.2.0/dist/color.wasm",
          "@sandom/font-metrics/font-metrics.wasm": "https://cdn.jsdelivr.net/npm/@sandom/font-metrics@0.1.0/dist/font-metrics.wasm",
          "@sandom/gain-map/gain-map.wasm": "https://cdn.jsdelivr.net/npm/@sandom/gain-map@0.1.0/dist/gain-map.wasm"
        }
      }
    </script>
    <style>
      /* The page holds a canvas and nothing else the visitor reads as part
         of the editor: every pixel inside it is Sandom's. The notice exists
         for the case where there is no WebGPU to render with. */
      html {
        background: #0b0f14;
        color: #8b949e;
        color-scheme: dark;
        font: 13px/1.5 ui-monospace, monospace;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }

      /* Not focusable: the input binding's hidden sink textarea takes the
         keyboard, and the caret inside the document is the focus
         indicator. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .notice {
        margin: 0;
        padding: 24px;
        max-width: 72ch;
      }
    </style>
  </head>
  <body>
    <p class="notice" id="notice">Starting the engine…</p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
