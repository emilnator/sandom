<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandom live list</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "sandom": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/mod.js",
          "sandom/src/": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/",
          "@sandom/color/color.wasm": "https://cdn.jsdelivr.net/npm/@sandom/color@0.2.0/dist/color.wasm",
          "@sandom/font-metrics/font-metrics.wasm": "https://cdn.jsdelivr.net/npm/@sandom/font-metrics@0.1.0/dist/font-metrics.wasm",
          "@sandom/gain-map/gain-map.wasm": "https://cdn.jsdelivr.net/npm/@sandom/gain-map@0.1.0/dist/gain-map.wasm"
        }
      }
    </script>
    <style>
      /* Two things side by side: the canvas, whose every pixel is Sandom's,
         and the cost panel, which is this page's own DOM. The panel stays
         outside the rendered document so reporting a frame never changes
         the document it reports on. */
      html {
        background: #0e1116;
        color: #c9d1d9;
        color-scheme: dark;
        font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
      }

      body {
        display: flex;
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }

      /* Not focusable: the input binding's hidden sink textarea takes the
         keyboard, and the caret inside the document is the focus
         indicator. */
      canvas {
        display: block;
        flex: none;
        width: 520px;
        height: 100vh;
      }

      .cost {
        flex: 1 1 0;
        min-width: 0;
        overflow: auto;
        padding: 14px 18px;
        border-left: 1px solid #222a35;
        background: #0b0e13;
      }

      .cost h2 {
        margin: 0 0 6px;
        color: #e6edf3;
        font-size: 13px;
        font-weight: 600;
      }

      .cost p {
        margin: 0 0 4px;
        color: #8b949e;
      }

      .cost table {
        margin-top: 10px;
        border-collapse: collapse;
        white-space: nowrap;
      }

      .cost th,
      .cost td {
        padding: 3px 9px 3px 0;
        text-align: right;
      }

      .cost th {
        color: #8b949e;
        font-weight: 400;
        border-bottom: 1px solid #222a35;
      }

      .cost th:first-child,
      .cost td:first-child {
        text-align: left;
        color: #e6edf3;
      }

      .cost td.zero {
        color: #4d5866;
      }

      .notice {
        margin: 0;
        padding: 24px;
        max-width: 72ch;
      }
    </style>
  </head>
  <body>
    <p class="notice" id="notice">Starting the engine…</p>
    <aside class="cost" id="cost" hidden>
      <h2>Cost per action</h2>
      <p id="totals"></p>
      <p id="ambient"></p>
      <table>
        <thead>
          <tr>
            <th>action</th>
            <th>frames</th>
            <th>dirty rects</th>
            <th>dirty px²</th>
            <th>serial.</th>
            <th>layout</th>
            <th>retained</th>
            <th>restyle</th>
            <th>scroll</th>
            <th>nodes</th>
            <th>raster ms</th>
            <th>prep ms</th>
            <th>host ms</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
