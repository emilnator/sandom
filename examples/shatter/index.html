<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shatter: a live Sandom document on breaking glass</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "sandom": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/mod.js",
          "sandom/src/": "https://cdn.jsdelivr.net/npm/sandom@0.5.0/src/",
          "@sandom/color/color.wasm": "https://cdn.jsdelivr.net/npm/@sandom/color@0.2.0/dist/color.wasm",
          "@sandom/font-metrics/font-metrics.wasm": "https://cdn.jsdelivr.net/npm/@sandom/font-metrics@0.1.0/dist/font-metrics.wasm",
          "@sandom/gain-map/gain-map.wasm": "https://cdn.jsdelivr.net/npm/@sandom/gain-map@0.1.0/dist/gain-map.wasm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.min.js"
        }
      }
    </script>
    <style>
      html {
        background: #05070a;
        color: #8b949e;
        color-scheme: dark;
        font: 13px/1.5 ui-monospace, monospace;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }

      #hint {
        position: fixed;
        top: 18px;
        left: 20px;
        margin: 0;
        color: #e6edf3;
      }

      #status {
        position: fixed;
        top: 18px;
        right: 20px;
        margin: 0;
      }

      #reassemble {
        position: fixed;
        left: 20px;
        bottom: 18px;
        padding: 6px 14px;
        border: 1px solid #2a3442;
        border-radius: 8px;
        background: #0f141b;
        color: #e6edf3;
        font: inherit;
        cursor: pointer;
      }

      #reassemble:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .notice {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #05070a;
      }

      .notice[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" role="img" aria-label="A pane of glass carrying a live settings page; click the glass to shatter it into interactive shards"></canvas>
    <p id="hint" role="status">Flip a toggle, or click the glass between controls to shatter it.</p>
    <p id="status" aria-label="Frame counters"></p>
    <button id="reassemble" type="button" disabled>Reassemble</button>
    <p class="notice" id="notice">Starting Sandom…</p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
